[package]
name = "mcp-template"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
rmcp = { version = "3.8.0", features = ["transport-io", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "io-std"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
